<!DOCTYPE html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ポートフォリオ</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <style>
      /* === Global Background === */
      body {
        background: url("/img/back.jpg") center / cover no-repeat fixed;
      }

      /* === Glass Panel (main wrapper) === */
      .bg-panel {
        background: rgba(245, 249, 255, 0.75); /* 淡いブルーの半透明 */
        border: 1px solid rgba(13, 110, 253, 0.3); /* プライマリ色の細枠 */
        border-radius: 0.75rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        padding: 1.25rem;
      }

      /* === Menu Link Card === */
      .menu-link {
        display: block;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.9); /* 白ベース */
        border: 1px solid rgba(13, 110, 253, 0.45); /* プライマリ色の枠線 */
        text-decoration: none;
        color: #212529;
        font-weight: 500;
        transition: all 0.25s ease;
      }

      .menu-link:hover {
        background: rgba(245, 249, 255, 0.95); /* ほんのりブルー */
        border-color: #0d6efd; /* より強いプライマリ色 */
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      }

      .menu-grid {
        display: grid;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- ── Header ─────────────────────────────────────────────── -->
    <header class="navbar navbar-light bg-white shadow-sm">
      <div class="container d-flex align-items-center">
        <a class="navbar-brand fw-bold me-auto" href="/menu">Tech&nbsp;Portfolio</a>

        <!-- 未ログイン時: ログインリンク（右端） -->
        <div sec:authorize="!isAuthenticated()">
          <a href="/oauth2/authorization/azure" class="btn btn-outline-primary btn-sm">
            Entra ID でログイン
          </a>
        </div>

        <!-- ログイン中: ユーザー名 + ログアウト（右端） -->
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
          <span class="text-muted small" sec:authentication="principal.preferredUsername"></span>
          <form th:action="@{/logout}" method="post">
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
          </form>
        </div>
      </div>
    </header>

    <!-- ── Main ──────────────────────────────────────────────── -->
    <main
      class="container flex-grow-1 d-flex align-items-center justify-content-center"
      style="padding: 4rem 0 3rem"
    >
      <div class="col-12 col-md-8 col-lg-6 bg-panel">
        <div class="menu-grid">
          <a href="career.html" class="menu-link">学歴・職歴</a>
          <a href="experience.html" class="menu-link">職歴詳細</a>
          <a href="architecture.html" class="menu-link">ポートフォリオサイトのシステム構成</a>

          <!-- ログイン後のみ表示 -->
          <a
            sec:authorize="isAuthenticated()"
            href="/secured/demo"
            class="menu-link"
          >
            認証デモ
          </a>

          <!-- 未ログイン時のみ表示 -->
          <div
            sec:authorize="!isAuthenticated()"
            class="menu-link text-muted"
            style="cursor: default; border-style: dashed"
          >
            認証デモ（Entra ID ログイン後のみ）
          </div>
        </div>
      </div>
    </main>

    <!-- ── Footer (黒帯) ─────────────────────────────────────── -->
    <footer class="bg-dark py-3 mt-auto"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
