<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>認証エラー - ポートフォリオ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: url("/img/back.jpg") center / cover no-repeat fixed;
      }
      .bg-panel {
        background: rgba(245, 249, 255, 0.75);
        border: 1px solid rgba(13, 110, 253, 0.3);
        border-radius: 0.75rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        padding: 1.25rem;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Tech&nbsp;Portfolio</a>
      </div>
    </header>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center" style="padding: 4rem 0 3rem;">
      <div class="col-12 col-md-8 col-lg-6 bg-panel text-center">
        <h4 class="mb-3 text-danger">認証に失敗しました</h4>
        <p class="text-muted mb-4">ログイン処理中にエラーが発生しました。再度お試しください。</p>
        <a href="/oauth2/authorization/azure" class="btn btn-primary">再ログイン</a>
      </div>
    </main>

    <footer class="bg-dark py-3 mt-auto"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
