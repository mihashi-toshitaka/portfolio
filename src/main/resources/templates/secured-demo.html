<!DOCTYPE html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>認証デモ - ポートフォリオ</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("/img/back.jpg") center / cover no-repeat fixed;
      }

      .bg-panel {
        background: rgba(245, 249, 255, 0.75);
        border: 1px solid rgba(13, 110, 253, 0.3);
        border-radius: 0.75rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        padding: 1.5rem;
      }

      .claim-table td:first-child {
        font-weight: 500;
        white-space: nowrap;
        width: 40%;
      }

      .claim-value {
        word-break: break-all;
        font-family: monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- ── Header ─────────────────────────────────────────────── -->
    <header class="navbar navbar-light bg-white shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="/menu">Tech&nbsp;Portfolio</a>

        <!-- ログイン中: ユーザー名 + ログアウト -->
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small" sec:authentication="principal.preferredUsername"></span>
          <form th:action="@{/logout}" method="post">
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
          </form>
        </div>
      </div>
    </header>

    <!-- ── Main ──────────────────────────────────────────────── -->
    <main
      class="container flex-grow-1 d-flex align-items-center justify-content-center"
      style="padding: 4rem 0 3rem"
    >
      <div class="col-12 col-md-10 col-lg-8 bg-panel">
        <!-- タイトル -->
        <div class="mb-4">
          <h4 class="fw-bold mb-1">Azure Entra ID 認証デモ</h4>
          <p class="text-muted mb-0 small">
            このページは Azure Entra ID (OIDC) による認証後のみアクセス可能です。
            以下に取得した ID トークンのクレーム情報を表示しています。
          </p>
        </div>

        <!-- 主要クレーム -->
        <div class="card mb-4">
          <div class="card-header fw-semibold">主要クレーム</div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0 claim-table">
              <tbody>
                <tr>
                  <td>ログインID (preferred_username)</td>
                  <td class="claim-value" th:text="${preferredUsername}"></td>
                </tr>
                <tr>
                  <td>氏名 (name)</td>
                  <td class="claim-value" th:text="${fullName}"></td>
                </tr>
                <tr>
                  <td>メールアドレス (email)</td>
                  <td class="claim-value" th:text="${email}"></td>
                </tr>
                <tr>
                  <td>Subject (sub)</td>
                  <td class="claim-value" th:text="${subject}"></td>
                </tr>
                <tr>
                  <td>発行者 (iss)</td>
                  <td class="claim-value" th:text="${issuer}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 全クレーム -->
        <div class="card mb-4">
          <div class="card-header fw-semibold">全クレーム一覧</div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0 claim-table">
              <tbody>
                <tr th:each="claim : ${claims}">
                  <td th:text="${claim.key}"></td>
                  <td class="claim-value" th:text="${claim.value}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 戻るリンク -->
        <div class="text-center">
          <a href="/menu" class="btn btn-outline-primary">メニューに戻る</a>
        </div>
      </div>
    </main>

    <!-- ── Footer ─────────────────────────────────────────── -->
    <footer class="bg-dark py-3 mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
