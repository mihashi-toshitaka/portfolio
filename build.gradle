plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.jk1.dependency-license-report' version '2.9'
}

group = 'com.mihashi_toshitaka'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "com.azure.spring:spring-cloud-azure-dependencies:5.22.0"
    }
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'io.github.cdimascio:java-dotenv:5.2.2'
    testImplementation 'io.github.cdimascio:java-dotenv:5.2.2'

	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'com.azure.spring:spring-cloud-azure-starter-active-directory'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'

}

tasks.named('test') {
	useJUnitPlatform()
}

import com.github.jk1.license.render.*
import com.github.jk1.license.importer.*
import com.github.jk1.license.filter.*

licenseReport {
    renderers = [
        new TextReportRenderer('THIRD-PARTY.txt'),
        new InventoryHtmlReportRenderer ('licenses.html')
    ]
    filters = [
        new LicenseBundleNormalizer()
    ]
     outputDir = "$projectDir/src/main/resources/static"
}

tasks.named('generateLicenseReport') {
    doLast {
        def staticDir = file("$projectDir/src/main/resources/static")
        staticDir.listFiles()?.each { file ->
            if (!['THIRD-PARTY.txt', 'licenses.html'].contains(file.name)) {
                if (file.isDirectory() && file.name.endsWith('.jar')) {
                    file.deleteDir()
                }
            }
        }
    }
}
