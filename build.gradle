import com.github.spotbugs.snom.SpotBugsTask

plugins {
	// コア言語 + Spring Boot ビルドプラグイン
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
	// ライセンスレポート出力
	id 'com.github.jk1.dependency-license-report' version '3.0.1'
	// コードフォーマット
	id 'com.diffplug.spotless' version '8.1.0'
	// 自動リファクタリングレシピ
	id 'org.openrewrite.rewrite' version '7.25.0'
	// ErrorProne 静的解析
	id 'net.ltgt.errorprone' version '4.3.0'
	// SpotBugs 静的解析
	id 'com.github.spotbugs' version '6.4.8'
	// OWASP 依存関係脆弱性スキャン
	id 'org.owasp.dependencycheck' version '12.2.0'
	// Checkstyle 設定
	id 'checkstyle'
	// EditorConfig 適用
	id 'org.ec4j.editorconfig' version '0.1.0'
}

// アプリケーション成果物の Maven 座標
group = 'com.mihashi_toshitaka'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// コンパイルに Java 21 ツールチェーンを使用
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		// annotationProcessor を compileOnly にも利用
		extendsFrom annotationProcessor
	}
}

// 依存関係は Maven Central を使用
repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		// Azure Spring の BOM で依存バージョンを揃える
		mavenBom "com.azure.spring:spring-cloud-azure-dependencies:5.23.0"
	}
}

dependencies {

	// Spring Boot の Web アプリ + 開発支援
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// サーバーサイド HTML テンプレート
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// Thymeleaf × Spring Security 連携（sec:authorize タグ使用）
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// テスト基盤
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// .env 読み込み（実行時 + テスト）
	implementation 'io.github.cdimascio:java-dotenv:5.2.2'
	testImplementation 'io.github.cdimascio:java-dotenv:5.2.2'

	// Lombok アノテーション
	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'

	// OAuth2 クライアント + Azure AD 連携
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'com.azure.spring:spring-cloud-azure-starter-active-directory'

	// Redis + Spring Session 連携
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	// Actuator エンドポイント + アーキテクチャテスト
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	// 静的解析ツール用依存
	errorprone 'com.google.errorprone:error_prone_core:2.45.0'
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
	// OpenRewrite レシピ
	rewrite 'org.openrewrite:rewrite-java:8.50.0'
	rewrite 'org.openrewrite.recipe:rewrite-spring:6.23.0'

}

tasks.named('test') {
	// JUnit Platform（JUnit 5）を使用
	useJUnitPlatform()
}

checkstyle {
	// Checkstyle ルール設定（警告で失敗）
	toolVersion = '12.1.2'
	configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
	maxWarnings = 0
}

editorconfig {
	// コードとドキュメントに EditorConfig を適用
	includes = ['**/*.java', '**/*.gradle', '**/*.md']
	excludes = ['build/**', '.gradle/**']
}

spotless {
	java {
		// Java ソースに Google Java Format を適用
		googleJavaFormat('1.33.0')
		target 'src/**/*.java'
	}
	format('misc') {
		// その他ファイルの空白正規化
		target '*.gradle', '*.md', '.gitignore'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

rewrite {
	// Spring Boot 3.5 へのアップグレードとコードクリーンアップ
	activeRecipe('org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5')
	activeRecipe('org.openrewrite.java.search.FindDeprecatedUses')
	activeRecipe('org.openrewrite.java.RemoveUnusedImports')
	activeRecipe('org.openrewrite.staticanalysis.CodeCleanup')
}

tasks.named('spotlessApply') {
	// rewrite 実行後にフォーマッタを適用
	mustRunAfter 'rewriteRun'
}

tasks.named('editorconfigFormat') {
	// rewrite 実行後に editorconfigFormat を実行
	mustRunAfter 'rewriteRun'
}

tasks.named('build') {
	// build 時は rewriteRun を先に実行し、保存時フォーマット（Spotless）を最終結果にする
	dependsOn 'rewriteRun'
	dependsOn 'spotlessApply'
}

tasks.named('check') {
	// 品質ゲートをまとめて実行
	dependsOn 'spotlessCheck', 'editorconfigCheck', 'checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'spotbugsTest'
	// dependencyCheckAnalyze は任意（.env/環境変数/Gradle プロパティで有効化）
	if (!skipDependencyCheckAnalyze()) {
		dependsOn 'dependencyCheckAnalyze'
	}
}

tasks.withType(SpotBugsTask).configureEach {
	reports {
		// 人が読む前提の HTML レポートを優先
		html.required = true
		xml.required = false
	}
	ignoreFailures = false
}

dependencyCheck {
	// OWASP dependency-check の設定
	failBuildOnCVSS = 11
	failOnError = false
	formats = ['HTML', 'JSON']
	// NVD API キー（任意）：.env / 環境変数 / Gradle プロパティから取得
	def envFile = file("$rootDir/.env")
	def envMap = [:]
	if (envFile.exists()) {
		envFile.eachLine { line ->
			def trimmed = line.trim()
			if (!trimmed || trimmed.startsWith('#')) {
				return
			}
			def idx = trimmed.indexOf('=')
			if (idx > 0) {
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
					value = value.substring(1, value.length() - 1)
				}
				envMap[key] = value
			}
		}
	}
	def nvdKey = envMap['NVD_API_KEY'] ?: System.getenv('NVD_API_KEY') ?: findProperty('nvdApiKey')?.toString()
	if (nvdKey) {
		nvd {
			apiKey = nvdKey
		}
	}
}

def loadDotenv() {
	// .env ファイルを Map に変換
	def envFile = file("$rootDir/.env")
	def envMap = [:]
	if (envFile.exists()) {
		envFile.eachLine { line ->
			def trimmed = line.trim()
			if (!trimmed || trimmed.startsWith('#')) {
				return
			}
			def idx = trimmed.indexOf('=')
			if (idx > 0) {
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
					value = value.substring(1, value.length() - 1)
				}
				envMap[key] = value
			}
		}
	}
	return envMap
}

def skipDependencyCheckAnalyze() {
	// 明示的に有効化されない限り dependency-check をスキップ
	def env = loadDotenv()
	def value = env['DEPENDENCY_CHECK_ANALYZE_ENABLED']
	if (value == null) {
		value = System.getenv('DEPENDENCY_CHECK_ANALYZE_ENABLED')
	}
	if (value == null) {
		value = findProperty('dependencyCheckAnalyzeEnabled')?.toString()
	}
	// デフォルトは明示的に有効化されるまでスキップ
	if (value == null) {
		return true
	}
	return !value.equalsIgnoreCase('true')
}

import com.github.jk1.license.render.*
import com.github.jk1.license.importer.*
import com.github.jk1.license.filter.*

licenseReport {
    renderers = [
        new TextReportRenderer('THIRD-PARTY.txt'),
        new InventoryHtmlReportRenderer ('licenses.html')
    ]
    filters = [
        new LicenseBundleNormalizer()
    ]
     outputDir = "$projectDir/src/main/resources/static"
}

tasks.named('generateLicenseReport') {
    doLast {
        def staticDir = file("$projectDir/src/main/resources/static")
        staticDir.listFiles()?.each { file ->
            if (!['THIRD-PARTY.txt', 'licenses.html'].contains(file.name)) {
                if (file.isDirectory() && file.name.endsWith('.jar')) {
                    file.deleteDir()
                }
            }
        }
    }
}
