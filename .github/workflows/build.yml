name: Build and Push Spring Boot Docker Image

on:
  push:
    tags:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ソースコードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # Java のセットアップ（バージョンは必要に応じて変更）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # Gradle のキャッシュ
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 実行権限を付与（gradlew がある場合）
      - name: Make gradlew executable
        run: chmod +x gradlew

      # bootJar ビルド
      - name: Build with bootJar
        run: ./gradlew bootJar

      # Jarの移動（.dockerignoreで build/ を除外しているため）
      - name: Copy JAR to root for Docker build
        run: cp build/libs/*.jar app.jar

      # 出力ファイルを保存（オプション）
      # - name: Upload artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: spring-boot-jar
      #     path: build/libs/*.jar

      # Docker Buildx のセットアップ（Docker イメージビルドに必要）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry にログイン
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker イメージをビルドし、GitHub Container Registry (GHCR) に push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/portfolio:${{ github.ref_name }}
